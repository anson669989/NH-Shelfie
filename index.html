<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      CSP：只允許自身腳本；圖片只允許 App 本機路徑（Capacitor 以 https://localhost/_capacitor_file_/ 提供）。
      網路請求走原生 HTTP（CapacitorHttp / Filesystem.downloadFile），不經 WebView，所以 connect-src 不放行外部網域。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://localhost capacitor://localhost; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="theme-color" content="#ed2553" />
    <title>NH Shelfie</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
